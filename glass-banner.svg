<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a46" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#16161d" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0a0a10" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0e7ff">
        <animate attributeName="stop-color" values="#e0e7ff;#a5b4fc;#67e8f9;#f9a8d4;#e0e7ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#e0e7ff;#a5b4fc;#67e8f9;#67e8f9" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="bubble"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- 液态光斑 -->
  <circle cx="150" cy="60" r="130" fill="url(#b1)" filter="url(#blur)">
    <animate attributeName="cx" values="150;260;150" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;120;60" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="140" fill="url(#b2)" filter="url(#blur)">
    <animate attributeName="cx" values="700;600;700" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="r" values="140;170;140" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="40" r="110" fill="url(#b3)" filter="url(#blur)">
    <animate attributeName="cy" values="40;110;40" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="220" r="120" fill="url(#b4)" filter="url(#blur)">
    <animate attributeName="cy" values="220;150;220" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="330;420;330" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- 上浮的小气泡 -->
  <g>
    <circle cx="120" cy="230" r="6" fill="url(#bubble)">
      <animate attributeName="cy" values="240;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="240" r="4" fill="url(#bubble)">
      <animate attributeName="cy" values="245;55" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="235" r="5" fill="url(#bubble)">
      <animate attributeName="cy" values="240;60" dur="8s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="8s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="245" r="3.5" fill="url(#bubble)">
      <animate attributeName="cy" values="248;58" dur="6.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 黑色磨砂玻璃面板 -->
  <rect x="30" y="38" width="790" height="184" rx="36" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.28;0.55;0.28" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="30" y="38" width="790" height="80" rx="36" fill="#8b8ba7" opacity="0.10"/>

  <text x="425" y="128" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="url(#title)">Hi, I'm 胡俊成</text>
  <text x="425" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#c9c9d8">
    Agent Engineer · Java / Python Backend · Front-end
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
